[package]
name = "gurd"
version = "0.2.0"
edition = "2024"
description = "Local-first terminal drug lookup"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sudomonas/gurd"
keywords = ["drug", "rxnorm", "medication", "cli", "offline"]
categories = ["command-line-utilities"]
exclude = ["/packaging", "/scripts"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
md-5 = "0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
anyhow = "1.0.104"
serde_json = "1.0.151"
tempfile = "3.27.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
default = ["net"]
# HTTP for `gurd update`. Without it the binary contains no network code at all.
net = ["dep:ureq"]

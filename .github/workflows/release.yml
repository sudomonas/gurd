name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Build & Upload (${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 glibc
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Linux x86_64 musl (fully static, universal across any Linux distro)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Linux ARM64 musl (fully static)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-13
          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build & Publish Release Binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: gurd
          target: ${{ matrix.target }}
          archive: $bin-$target
          include: README.md,LICENSE,DATA-LICENSES.md,CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
